# ============================================================================
# 로컬 검증용 최소 오버라이드 (D-05) — 실서버 없이 운영 compose(compose.prod.yml)를 그대로 띄워
# healthcheck 게이트·actuator 차단·볼륨 영속을 로컬에서 실증한다. 오버라이드는 작을수록 좋다.
#
# 실행: 1) cp -n .env.example deploy/.env (최초 1회, 임시값만 채움)
#       2) docker compose -f deploy/compose.prod.yml -f deploy/compose.local.yml --env-file deploy/.env up -d
#
# deploy/.env 인 이유: 서비스 env_file: 은 project directory(첫 -f 파일이 있는 deploy/) 기준으로 해석된다.
# ============================================================================

services:
  app:
    # GHCR에 아직 이미지가 없어(D-02/D-03) 07-02가 로컬 빌드한 이미지로 치환한다.
    image: gw-be:test
    # 운영에는 없는 설정 — 로컬에서 앱을 직접 찔러볼 수 있도록 호스트 포트 하나만 노출한다.
    ports:
      - "18080:8080"

  caddy:
    # deploy/Caddyfile 본문은 로컬 전용 개념으로 오염시키지 않는다. 대신 파일을 새로 만들지 않고
    # 이 compose 안에 내용을 담는 Compose inline config로 아주 짧은 로컬 전용 진입점을 만들어
    # 전역 옵션 local_certs(내부 CA 자체 서명)만 추가하고, import 로 원본 Caddyfile을 그대로 불러온다.
    configs:
      - source: caddy_local_entry
        target: /etc/caddy/local.Caddyfile
    command: ["caddy", "run", "--config", "/etc/caddy/local.Caddyfile", "--adapter", "caddyfile"]

configs:
  caddy_local_entry:
    content: |
      {
      	local_certs
      }

      import Caddyfile
