# ============================================================================
# 운영 오케스트레이션 (INFRA-03/04/05) — 07-03-PLAN.md
# 표기: D-1xx = docs/decisions.md 전역 결정 / 07-CONTEXT D-xx = .planning/phases/07-container-server-setup/07-CONTEXT.md 로컬 결정(실행 맥락, 스펙 아님)
#
# 서버 배치 경로: /opt/gold-wrestling/compose.prod.yml (07-CONTEXT D-18, 서버에는 git 없이 파일만 scp)
# 서버 실행:      docker compose -f compose.prod.yml --env-file .env up -d
# 로컬 사전 검증(07-CONTEXT D-05, 실서버 없이): 이 파일에 deploy/compose.local.yml 을 얹어 GHCR 대신
#   로컬 빌드 이미지(gw-be:test)로 3컨테이너를 띄운다.
#   docker compose -f deploy/compose.prod.yml -f deploy/compose.local.yml --env-file deploy/.env up -d
#
# 로컬 개발용 docker-compose.yml(레포 루트)은 이 파일과 무관하며 무변경이다 (07-CONTEXT D-17).
#   - 로컬 docker-compose.yml: postgres 1개만, 호스트 포트 5432 노출, 로컬 학습·개발용
#   - 이 파일:                 app+postgres+caddy 3개, postgres/app 호스트 포트 미노출(Caddy만 노출)
#
# 메모리 예산 전제 (INFRA-05, 07-CONTEXT D-06, D-173): 세 컨테이너 limit 합계는 app 550M + postgres 300M + caddy 50M = 900M이다.
#   t3.micro RAM 1GB(실제 가용 약 950MB)에서 OS·dockerd·sshd 몫이 100MB 남짓뿐이라 **스왑 2GB가 켜져 있는 것을
#   전제**로 한다(스왑은 7b의 deploy/server-setup.sh가 만든다). limit은 "한 컨테이너의 폭주가 나머지를 끌고 내려가지 않게 하는
#   상한"이지 상시 점유량이 아니다 — 로컬 실측 RSS는 app 약 365MiB / postgres 약 34MiB / caddy 약 19MiB(합 약 420MiB)였다.
#   실서버 `docker stats` 실측으로 limit·JVM 비율을 확정하고 예산표(docs/operations.md, 7b)에 기록한다.
# ============================================================================

services:
  postgres:
    image: postgres:18.4-alpine
    # 로컬 dev용 docker-compose.yml의 컨테이너 이름(gold-wrestling-postgres)과 충돌하지 않도록
    # 운영 compose는 별도 접두사를 쓴다 — 로컬에서 두 compose를 동시에 띄워 검증할 수 있어야 한다(07-CONTEXT D-05).
    container_name: gw-prod-postgres
    restart: unless-stopped
    environment:
      # 값은 .env (project directory = 이 compose 파일이 있는 디렉토리 기준, 서버에서는 /opt/gold-wrestling/.env) 에서 주입된다
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    # 300M 메모리 예산 안에서 동작하도록 축소한 파라미터 (07-CONTEXT D-11).
    # max_connections=20 근거: Hikari maximum-pool-size=5(D-170) + 배치 REQUIRES_NEW가
    # 한 흐름에서 커넥션을 최대 2개 쓰는 패턴 + 운영/점검용 여유분. 실제 부하테스트(Phase 10)에서 재조정 대상.
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=192MB
      -c max_connections=20
    volumes:
      # Postgres 18+ 이미지는 데이터 디렉터리를 메이저 버전별 하위 폴더로 관리한다.
      # /var/lib/postgresql/data 에 마운트하면 기동 자체가 실패하므로 /var/lib/postgresql 에 마운트한다.
      - postgres-data:/var/lib/postgresql
    # 호스트 포트 미노출 (로컬 docker-compose.yml과 다른 유일한 지점) — compose 내부 네트워크로만 app이 접근한다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 300M

  app:
    # Phase 8이 커밋 SHA 태그로 덮어쓸 수 있게 ${APP_IMAGE} 로 감싼다. 비우면 :latest.
    image: ${APP_IMAGE:-ghcr.io/minsu-zip/gold-wrestling-be:latest}
    container_name: gw-prod-app
    restart: unless-stopped
    # 실행 명령은 이미지의 ENTRYPOINT(java -jar application.jar)를 그대로 쓴다 — compose가 jar 이름을 알 필요가 없다 (D-176).
    # 서비스 레벨 env_file: 은 CLI 실행 위치가 아니라 project directory(첫 -f 파일이 있는 디렉토리,
    # 즉 이 파일이 있는 deploy/ 또는 서버의 /opt/gold-wrestling/) 기준으로 해석된다.
    # 로컬 검증에서는 deploy/.env 가 있어야 하고, 서버에서는 compose와 .env 가 같은 디렉토리에 있어 그대로 맞는다.
    env_file: .env
    environment:
      # 힙 상한을 이미지가 아니라 여기서 주입해 재빌드 없이 조정 가능하게 한다 (D-173).
      # .env 의 JAVA_TOOL_OPTIONS 로 통째 덮어쓸 수 있도록 기본값 치환 형태를 쓴다.
      #   -XX:MaxRAMPercentage=60.0   : 550M 컨테이너 중 힙 약 330M / 비힙(메타스페이스·스레드·코드캐시) 약 220M 배분
      #   -XX:+UseSerialGC            : t3.micro 1 vCPU 환경에서 병렬 GC 스레드는 컨텍스트 스위칭 오버헤드만 늘린다
      #   -XX:ActiveProcessorCount=1  : t3.micro 실제 vCPU 수와 JVM이 감지하는 CPU 수를 맞춘다
      #   -XX:+ExitOnOutOfMemoryError : OOM 시 크래시 덤프 없이 깨끗이 종료 → 아래 restart 정책이 재기동시킨다
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC -XX:ActiveProcessorCount=1 -XX:+ExitOnOutOfMemoryError}
    depends_on:
      postgres:
        condition: service_healthy
    # 호스트 포트 미노출 — 외부 진입점은 Caddy뿐이다.
    healthcheck:
      # noble 런타임 베이스(eclipse-temurin:21-jre-noble)에 curl이 이미 포함돼 있어 추가 설치가 필요 없다.
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 550M

  caddy:
    # Debian 계열(-alpine 아님). 선택 이유와 -alpine 장시간 메모리 증가 커뮤니티 보고는 07-04 운영 문서에서 다룬다.
    # 메이저만 고정한 caddy:2 는 배급사가 마이너를 조용히 올린다 — D-172(짧은 태그 금지)와 같은 원칙으로 마이너까지 고정한다.
    # 2026-09-09 기준 caddy:2 = v2.11.4. 마이너 상향은 의도적 커밋으로만 한다.
    image: caddy:2.11
    container_name: gw-prod-caddy
    restart: unless-stopped
    # 세 서비스 중 유일하게 호스트 포트를 노출한다 — 유일한 외부 진입점.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy_data 가 인증서 저장소다 — named volume 이어야 컨테이너 재시작이 재발급을 유발하지 않는다 (INFRA-04).
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    environment:
      # Caddyfile 의 {$DOMAIN:localhost}/{$ACME_EMAIL} 은 값이 "빈 문자열로 설정"돼도 기본값이 적용되지 않고 파싱 실패로
      # 재시작 루프에 빠진다(07-03 실측: DOMAIN= / ACME_EMAIL= 모두 caddy validate 실패). compose 의 ${VAR:?msg} 는
      # unset 과 빈 문자열을 모두 잡아 `up` 시점에 이 메시지와 함께 멈춘다 — 죽은 컨테이너 로그를 뒤지지 않게 한다 (D-177).
      # 로컬 검증은 deploy/.env 에 DOMAIN=localhost, ACME_EMAIL=dev@example.invalid 를 채운다 (compose.local.yml 참조).
      DOMAIN: ${DOMAIN:?DOMAIN 필수 — .env 에 실도메인(로컬 검증은 localhost)을 채우세요}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL 필수 — Let's Encrypt 만료 알림 이메일을 .env 에 채우세요 (로컬 검증은 dev@example.invalid)}
    depends_on:
      # 기동 순서만 보장한다 — healthcheck 조건은 불필요, Caddy는 업스트림이 늦게 떠도 재시도한다.
      - app
    deploy:
      resources:
        limits:
          memory: 50M

volumes:
  postgres-data:
  caddy_data:
  caddy_config:
