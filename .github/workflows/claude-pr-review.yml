# Claude PR 자동 리뷰 봇
#
# PR이 열리거나 커밋이 추가될 때 Claude가 변경 코드를 리뷰하고
# 인라인 코멘트 + 요약 코멘트를 남긴다.
#
# 사전 준비 (1회):
#   1. GitHub 앱 설치: https://github.com/apps/claude → minsu-zip/gold-wrestling-be 에 설치
#   2. 터미널에서 `claude setup-token` 으로 구독 토큰 발급 (Pro/Max 개인 구독용)
#   3. `gh secret set CLAUDE_CODE_OAUTH_TOKEN` 으로 레포 시크릿 등록
#   (API 키 과금 방식으로 바꾸려면 ANTHROPIC_API_KEY 시크릿 등록 후
#    아래 claude_code_oauth_token 줄을 anthropic_api_key 로 교체)

name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [dev, main]
    paths-ignore:
      - ".planning/**" # GSD 실행 기록은 리뷰 대상이 아니다

# 같은 PR에 커밋을 연달아 푸시하면 이전 리뷰 실행을 취소하고 최신 것만 돌린다 (비용 절약)
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write # claude-code-action이 OIDC 토큰으로 GitHub 앱 토큰을 교환받는 데 필요

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # base 브랜치와의 diff 계산에 전체 이력 필요

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true # 요약은 코멘트 하나를 갱신 (푸시마다 새 코멘트 금지)
          prompt: |
            이 PR의 변경 코드를 리뷰해줘. 이 레포는 소유자의 백엔드 학습을 겸한다 —
            모든 코멘트는 한국어로 쓰고, 지적마다 "왜 문제인지"를 1~2문장 덧붙인다.

            먼저 CLAUDE.md, docs/conventions.md, docs/policies.md, docs/glossary.md,
            docs/decisions.md 를 읽고, 아래 기준으로 변경분을 대조한다 (우선순위 순):

            1. 프로젝트 규칙 준수
               - 엔티티: data class 금지 / @ManyToOne fetch=LAZY 명시 / @Enumerated(EnumType.STRING) 필수
               - 에러 응답: RFC 9457 ProblemDetail 고정, 커스텀 공통 래퍼 금지 (D-017)
               - 횟수(BigDecimal): 비교는 compareTo만, equals 금지 (D-016)
               - 트랜잭션: 서비스 계층에만 @Transactional, 컨트롤러·리포지토리 금지 (D-020)
               - 시간: LocalDate/LocalTime/OffsetDateTime(timestamptz)만, LocalDateTime+timestamp 금지,
                 현재 시각은 Clock 빈 주입, 시간대 Asia/Seoul
               - 네이밍: docs/glossary.md 용어만 사용 (Ticket/Voucher/Booking 등 금지)
               - 잔여 횟수 변경이 있으면 반드시 PassTransaction 이력이 함께 남는지
            2. 기술 스택 정합 — Spring Boot 4.1.x (Spring Framework 7) 기준.
               Boot 3 전용 패턴·설정 키·스타터명·의존성 버전이 섞여 들어왔는지
            3. 보안 — 시크릿 실값 커밋, 에러 응답·로그의 내부 정보 노출,
               인젝션, 인증/인가 우회, IDOR(남의 리소스 접근) 가능성
            4. DB 스키마 — 이미 커밋된 Flyway 마이그레이션 파일을 수정했는지(절대 금지,
               새 버전 추가만 허용), ddl-auto 변경 여부
            5. 테스트 — docs/conventions.md §10.0 변경유형별 표 기준으로 이 변경에 필요한
               테스트가 같은 PR에 있는지. 잔여 횟수·예약 검증·동시성 코드면 필수
            6. API 계약 — src의 API 표면이 바뀌었는데 docs/api/openapi.yaml 재생성·커밋이
               빠졌는지
            7. 설계/베스트 프랙티스 — N+1 가능성, 동시성(정원·1:1 슬롯의 DB 제약/락),
               멱등성, 인덱스 누락, 계층 간 책임 침범(엔티티 API 노출 등)

            결과 작성 방식:
            - 발견 사항은 Critical / Warning / Info 로 분류하고, 해당 라인에 인라인 코멘트
            - 요약 코멘트에 심각도별 개수와 핵심 3줄 요약
            - 위반이 없으면 "규칙 위반 없음"과 함께 이 PR에서 잘한 점 1~2개를 남긴다
            - 확실하지 않은 추측성 지적은 Info로 낮추고 그 이유를 밝힌다

            절대 규칙 — 코멘트 없이 종료 금지:
            - 어떤 경우에도 마지막 행동은 `gh pr comment`(요약 코멘트 게시)여야 한다.
              도구 호출 없이 텍스트로만 답하고 끝내면 그 내용은 아무 데도 게시되지 않고
              사라진다 — 그것은 리뷰를 하지 않은 것과 같다.
            - 리뷰를 끝까지 못 했더라도(파일이 너무 많음, 턴 부족 등) 지금까지 확인한
              범위와 미확인 범위를 명시한 부분 리뷰 요약을 반드시 `gh pr comment`로 남긴다.
            - 재리뷰(이미 이전 리뷰 코멘트가 있는 경우)도 동일하다 — "변경 없음"이든
              "이전 지적 해소 확인"이든 결과를 반드시 코멘트로 남기고 종료한다.
            - 턴 예산 관리: 전체 턴의 마지막 1/4은 코멘트 작성용으로 남겨둔다.
              PR이 크면 diff를 전부 정독하지 말고 우선순위 기준 1~4(규칙·스택·보안·스키마)
              위주로 샘플링하되, 그 사실을 요약 코멘트에 밝힌다.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --max-turns 60
            --model claude-sonnet-5
