# Claude PR 자동 리뷰 봇
#
# PR이 열리거나 커밋이 추가될 때 Claude가 변경 코드를 리뷰하고
# 인라인 코멘트 + 요약 코멘트를 남긴다.
#
# 사전 준비 (1회):
#   1. GitHub 앱 설치: https://github.com/apps/claude → minsu-zip/gold-wrestling-be 에 설치
#   2. 터미널에서 `claude setup-token` 으로 구독 토큰 발급 (Pro/Max 개인 구독용)
#   3. `gh secret set CLAUDE_CODE_OAUTH_TOKEN` 으로 레포 시크릿 등록
#   (API 키 과금 방식으로 바꾸려면 ANTHROPIC_API_KEY 시크릿 등록 후
#    아래 claude_code_oauth_token 줄을 anthropic_api_key 로 교체)

name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [dev, main]
    paths-ignore:
      - ".planning/**" # GSD 실행 기록은 리뷰 대상이 아니다

# 같은 PR에 커밋을 연달아 푸시하면 이전 리뷰 실행을 취소하고 최신 것만 돌린다 (비용 절약)
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write # claude-code-action이 OIDC 토큰으로 GitHub 앱 토큰을 교환받는 데 필요

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      # 프롬프트·인자를 job env로 올린 이유: 아래 1차 실행과 재시도 실행이 **같은 프롬프트**를
      # 써야 한다. 두 스텝에 복붙해 두면 한쪽만 고치는 드리프트가 반드시 생긴다.
      REVIEW_PROMPT: |
        이 PR의 변경 코드를 리뷰해줘. 이 레포는 소유자의 백엔드 학습을 겸한다 —
        모든 코멘트는 한국어로 쓰고, 지적마다 "왜 문제인지"를 1~2문장 덧붙인다.

        먼저 CLAUDE.md, docs/conventions.md, docs/policies.md, docs/glossary.md,
        docs/decisions.md 를 읽고, 아래 기준으로 변경분을 대조한다 (우선순위 순):

        1. 프로젝트 규칙 준수
           - 엔티티: data class 금지 / @ManyToOne fetch=LAZY 명시 / @Enumerated(EnumType.STRING) 필수
           - 에러 응답: RFC 9457 ProblemDetail 고정, 커스텀 공통 래퍼 금지 (D-017)
           - 횟수(BigDecimal): 비교는 compareTo만, equals 금지 (D-016)
           - 트랜잭션: 서비스 계층에만 @Transactional, 컨트롤러·리포지토리 금지 (D-020)
           - 시간: LocalDate/LocalTime/OffsetDateTime(timestamptz)만, LocalDateTime+timestamp 금지,
             현재 시각은 Clock 빈 주입, 시간대 Asia/Seoul
           - 네이밍: docs/glossary.md 용어만 사용 (Ticket/Voucher/Booking 등 금지)
           - 잔여 횟수 변경이 있으면 반드시 PassTransaction 이력이 함께 남는지
        2. 기술 스택 정합 — Spring Boot 4.1.x (Spring Framework 7) 기준.
           Boot 3 전용 패턴·설정 키·스타터명·의존성 버전이 섞여 들어왔는지
        3. 보안 — 시크릿 실값 커밋, 에러 응답·로그의 내부 정보 노출,
           인젝션, 인증/인가 우회, IDOR(남의 리소스 접근) 가능성
        4. DB 스키마 — 이미 커밋된 Flyway 마이그레이션 파일을 수정했는지(절대 금지,
           새 버전 추가만 허용), ddl-auto 변경 여부
        5. 테스트 — docs/conventions.md §10.0 변경유형별 표 기준으로 이 변경에 필요한
           테스트가 같은 PR에 있는지. 잔여 횟수·예약 검증·동시성 코드면 필수
        6. API 계약 — src의 API 표면이 바뀌었는데 docs/api/openapi.yaml 재생성·커밋이
           빠졌는지
        7. 설계/베스트 프랙티스 — N+1 가능성, 동시성(정원·1:1 슬롯의 DB 제약/락),
           멱등성, 인덱스 누락, 계층 간 책임 침범(엔티티 API 노출 등)

        결과 작성 방식:
        - 발견 사항은 Critical / Warning / Info 로 분류하고, 해당 라인에 인라인 코멘트
        - 요약 코멘트에 심각도별 개수와 핵심 3줄 요약
        - 위반이 없으면 "규칙 위반 없음"과 함께 이 PR에서 잘한 점 1~2개를 남긴다
        - 확실하지 않은 추측성 지적은 Info로 낮추고 그 이유를 밝힌다

        절대 규칙 — 코멘트 없이 종료 금지:
        - 어떤 경우에도 마지막 행동은 `gh pr comment`(요약 코멘트 게시)여야 한다.
          도구 호출 없이 텍스트로만 답하고 끝내면 그 내용은 아무 데도 게시되지 않고
          사라진다 — 그것은 리뷰를 하지 않은 것과 같다.
        - 리뷰를 끝까지 못 했더라도(파일이 너무 많음, 턴 부족 등) 지금까지 확인한
          범위와 미확인 범위를 명시한 부분 리뷰 요약을 반드시 `gh pr comment`로 남긴다.
        - 재리뷰(이미 이전 리뷰 코멘트가 있는 경우)도 동일하다 — "변경 없음"이든
          "이전 지적 해소 확인"이든 결과를 반드시 코멘트로 남기고 종료한다.
        - 턴 예산 관리: 전체 턴의 마지막 1/4은 코멘트 작성용으로 남겨둔다.
          PR이 크면 diff를 전부 정독하지 말고 우선순위 기준 1~4(규칙·스택·보안·스키마)
          위주로 샘플링하되, 그 사실을 요약 코멘트에 밝힌다.
      REVIEW_ARGS: |
        --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(grep:*),Bash(rg:*),Bash(cat:*),Bash(ls:*),Bash(find:*),Bash(wc:*),Bash(sed:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
        --max-turns 60
        --model claude-sonnet-5
      # 재시도 때만 프롬프트 뒤에 덧붙는다. 조용한 종료의 실제 원인이 대개
      # "이미 리뷰가 있으니 새로 할 말 없음"이라는 판단이므로, 그 판단 자체를 코멘트로
      # 남기게 만드는 것이 핵심이다.
      RETRY_NOTE: |

        ── 재시도 안내 (직전 시도가 코멘트 없이 끝나 다시 실행된 것이다) ──
        직전 실행은 코멘트를 하나도 남기지 않고 종료했고, 그 결과물은 사라졌다.
        이번에는 무엇을 발견했든 **반드시 `gh pr comment` 호출로 끝낸다.**
        - 이전 리뷰 코멘트가 이미 있어 "새로 지적할 게 없다"고 판단되더라도,
          그 판단 자체를 코멘트로 남긴다 — 예: "직전 리뷰 이후 추가된 커밋 N건을 확인했고
          새 지적 없음. 이전 Warning은 해소됨." 침묵은 리뷰를 하지 않은 것으로 처리된다.
        - 이번에도 코멘트가 없으면 CI가 실패하고 사람이 수동으로 재실행해야 한다.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # base 브랜치와의 diff 계산에 전체 이력 필요

      # 액션 실행 전 시각을 기록해 둔다 — 아래 집계가 "이번 실행이 남긴 코멘트"만 세기 위해서.
      # 이전 실행이 남긴 오래된 코멘트를 세면 조용한 실패를 그대로 통과시킨다.
      - id: mark
        run: echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # 집계 로직을 파일 하나로 만들어 1차 집계·최종 검증 두 스텝이 공유한다.
      # 스텝마다 같은 셸 함수를 복붙하면 한쪽만 고쳐져 두 판정이 갈리는 사고가 난다.
      - name: 코멘트 집계 헬퍼 준비
        run: |
          cat > "$RUNNER_TEMP/count-claude-comments.sh" <<'SH'
          #!/usr/bin/env bash
          # 사용법: count-claude-comments.sh <SINCE(ISO8601 UTC)>
          # claude[bot]이 SINCE 이후 남긴 요약 코멘트 + 인라인 코멘트 개수의 합을 출력한다.
          # updated_at 기준인 이유: use_sticky_comment가 켜져 있어 기존 코멘트를 "갱신"하는
          # 경우도 이번 실행이 리뷰를 남긴 것으로 인정해야 한다.
          set -euo pipefail
          since="$1"
          count_in() {
            # --paginate는 페이지마다 한 줄씩 뱉으므로 awk로 합산한다.
            gh api "repos/${GITHUB_REPOSITORY}/$1/${PR_NUMBER}/comments" --paginate \
              --jq "[.[] | select(.user.login == \"claude[bot]\") | select(.updated_at > \"${since}\")] | length" \
              | awk '{ sum += $1 } END { print sum + 0 }'
          }
          echo $(( $(count_in issues) + $(count_in pulls) ))
          SH
          chmod +x "$RUNNER_TEMP/count-claude-comments.sh"

      # continue-on-error: 1차가 하드 실패해도 잡을 끊지 않는다 — 재시도에 기회를 준다.
      # 최종 판정은 맨 아래 검증 스텝이 "코멘트가 실제로 남았는가"로 내린다.
      - id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true # 요약은 코멘트 하나를 갱신 (푸시마다 새 코멘트 금지)
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: ${{ env.REVIEW_ARGS }}

      - name: 1차 시도 코멘트 집계
        id: attempt1
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.mark.outputs.since }}
        run: |
          COUNT=$("$RUNNER_TEMP/count-claude-comments.sh" "$SINCE")
          echo "1차 시도가 남긴 코멘트: ${COUNT}건"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

      # 자동 재시도 — 이 워크플로우 수정의 핵심.
      #
      # 조용한 종료는 모델의 비결정적 판단이라 프롬프트로 100% 막을 수 없다. 지금까지는
      # 게이트가 빨간불만 띄우고 사람이 `gh run rerun`을 쳐야 했는데, 그 수동 조작이
      # 재시도로 대개 해결된다는 것이 이미 확인된 사실이다. 그렇다면 워크플로우가
      # 직접 한 번 더 돌리는 게 맞다.
      #
      # 재시도하지 않는 경우: 액션이 아예 스킵된 때(conclusion 출력이 비어 있고 스텝도
      # 실패하지 않음). 워크플로우 파일을 고치는 PR은 정의상 항상 그 상태라, 재시도해도
      # 똑같이 스킵되고 비용만 두 배가 된다.
      - id: claude_retry
        if: always() && steps.attempt1.outputs.count == '0' && (steps.claude.outcome == 'failure' || steps.claude.outputs.conclusion != '')
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            ${{ env.REVIEW_PROMPT }}
            ${{ env.RETRY_NOTE }}
          claude_args: ${{ env.REVIEW_ARGS }}

      # 최종 게이트 — 1차든 재시도든 코멘트가 하나라도 남았으면 통과.
      #
      # 왜 필요한가: 액션은 모델이 아무 코멘트도 남기지 않아도 is_error=false로 끝나기
      # 때문에, "리뷰함"과 "조용히 포기함"이 CI 화면에서 똑같이 초록불로 보인다. 실제로
      # PR #8에서 같은 커밋을 두 번 돌렸을 때 1차는 6턴 만에 코멘트 0건으로 끝났고 CI는
      # 성공이었다. 프롬프트의 "코멘트 없이 종료 금지" 문장은 확률을 낮출 뿐 보장이
      # 아니므로, 결과물(코멘트)의 존재를 워크플로우가 직접 확인한다.
      #
      # 단, 봇이 아예 실행되지 않은 경우는 실패로 치지 않는다 — claude-code-action은
      # 워크플로우 파일이 기본 브랜치(main) 버전과 한 글자라도 다르면 "Skipping action due
      # to workflow validation"으로 스킵하고 exit 0으로 끝난다. 이 파일 자체를 고치는 PR은
      # 정의상 항상 그 상태이므로, 구분하지 않으면 워크플로우 수정 PR이 영원히
      # 빨간불이 된다(닭과 달걀). 스킵된 경우는 warning만 남긴다.
      - name: 리뷰 코멘트 게시 여부 검증
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.mark.outputs.since }}
          FIRST_COUNT: ${{ steps.attempt1.outputs.count }}
          # 액션이 실제로 돌면 conclusion 출력을 남기고, 스킵되면 아무 출력도 남기지 않는다.
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          OUTCOME: ${{ steps.claude.outcome }}
          RETRY_CONCLUSION: ${{ steps.claude_retry.outputs.conclusion }}
          RETRY_OUTCOME: ${{ steps.claude_retry.outcome }}
        run: |
          TOTAL=$("$RUNNER_TEMP/count-claude-comments.sh" "$SINCE")
          if [ -z "$RETRY_OUTCOME" ] || [ "$RETRY_OUTCOME" = "skipped" ]; then
            echo "이번 실행이 남긴 코멘트 ${TOTAL}건 (재시도 없음)"
          else
            echo "이번 실행이 남긴 코멘트 ${TOTAL}건 (1차 ${FIRST_COUNT}건 → 재시도 실행됨)"
          fi

          if [ "$TOTAL" -gt 0 ]; then
            exit 0
          fi

          if [ -z "$CONCLUSION" ] && [ -z "$RETRY_CONCLUSION" ] \
            && [ "$OUTCOME" != "failure" ] && [ "$RETRY_OUTCOME" != "failure" ]; then
            echo "::warning::리뷰봇이 실행되지 않았습니다 — 워크플로우 파일이 기본 브랜치(main)와 달라 스킵됐습니다. 이 변경이 main에 머지된 뒤부터 리뷰·게이트가 작동합니다."
            exit 0
          fi

          echo "::error::리뷰봇이 재시도까지 했는데도 코멘트를 남기지 않았습니다. 'gh run rerun ${GITHUB_RUN_ID}'로 다시 실행하세요."
          exit 1
