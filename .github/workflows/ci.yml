# 테스트 CI (BE)
#
# PR(dev·main 대상)과 dev/main push에서 품질 게이트(ktlint + 컴파일 + 전체 테스트)를 자동으로 재현한다.
# 레포 public 전환으로 main 브랜치 보호가 다시 강제되므로, 이 워크플로가 머지 차단의 근거다.
# 트리거 설계는 FE 레포 ci.yml과 정합한다 (PR+push, paths-ignore 없음).
#
# paths-ignore를 일부러 걸지 않는다 (.planning/** 문서 전용 PR도 풀 빌드가 돈다).
# 이 워크플로의 job은 required status check 등록 대상이라, 경로 필터로 워크플로 자체가
# 스킵되면 체크가 영영 보고되지 않아 문서 전용 PR이 "Expected — waiting for status"에서
# 머지 불가로 멈춘다. 러너 비용보다 게이트 일관성이 우선이다 (FE D-08과 같은 이유).
#
# 통합 테스트(Testcontainers postgres:18.4-alpine)는 러너의 Docker 데몬을 그대로 쓴다 —
# ubuntu-latest에 Docker가 기본 탑재라 서비스 컨테이너·DinD 설정이 필요 없다.
# .env도 필요 없다: 테스트 전제값(JWT 더미 시크릿, 배치 킬스위치)은 build.gradle.kts의
# tasks.withType<Test> systemProperty가 주입하고, DB는 Testcontainers가 올린다.
#
# main 브랜치 보호 required status check 등록 절차는 README.md "CI · 브랜치 보호" 섹션이 정본이다.

name: CI

on:
  # PR에만 걸면 dev로 직접 들어온 커밋이 검사를 빠져나간다. push도 함께 건다.
  # 포크 PR에 저장소 컨텍스트를 주는 트리거(pull_request_target 등 권한 상승 표면)는 쓰지 않는다.
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# 같은 브랜치에 커밋을 연달아 밀면 이전 실행을 취소하고 최신 것만 남긴다 — 러너 낭비 방지.
# 리뷰 봇(claude-pr-review.yml)의 group(claude-review-*)과 겹치지 않도록 ci- 접두를 붙인다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 테스트 CI는 코멘트를 남기지도 커밋을 밀지도 않는다 — 체크아웃에 필요한 읽기 권한이면 충분하다.
permissions:
  contents: read

jobs:
  build:
    # 이 이름이 required status check "CI / build"의 근거다. 바꾸면 main 보호 규칙의
    # 등록 항목을 같은 시점에 함께 고쳐야 한다 (README "CI · 브랜치 보호" 참조).
    name: build
    runs-on: ubuntu-latest
    # 전체 테스트가 Testcontainers로 실제 Postgres를 올리므로 로컬보다 오래 걸린다.
    # 콜드 캐시(의존성 전체 다운로드) 첫 실행까지 감안한 상한이다.
    timeout-minutes: 30
    steps:
      # persist-credentials: false — 체크아웃 이후 git 원격 작업이 없으므로
      # GITHUB_TOKEN을 워크스페이스 git 설정에 남길 이유가 없다 (최소 권한 관행).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # JDK 21은 build.gradle.kts의 toolchain 선언(D-005)과 같은 버전이다.
      # toolchain이 러너에서 JDK를 내려받게 두지 않고 미리 깔아 빌드 시간을 아낀다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 캐시(의존성·wrapper)와 wrapper 검증을 함께 제공한다.
      # setup-java의 cache: gradle 대신 이걸 쓰는 이유: 캐시 키 관리가 더 정교하고
      # (읽기 전용/쓰기 분리, 브랜치별 격리) wrapper 무결성 검증이 내장돼 있다.
      - uses: gradle/actions/setup-gradle@v4

      # build는 ktlint 플러그인이 check에 배선한 ktlintCheck를 이미 포함하지만,
      # 포맷 위반을 컴파일·테스트보다 먼저 빠르게 떨어뜨리도록 명시적으로 앞세운다.
      - run: ./gradlew ktlintCheck build

  # deploy/ 아래 bash 스크립트(서버 초기 세팅 등)는 Gradle 빌드가 전혀 보지 않는다. 문법(bash -n)과
  # 정적 분석(shellcheck — ubuntu-latest 기본 탑재)을 여기서 건다. 스크립트가 실서버에서 set -e로 멈추면
  # 사람이 SSH로 들어가 디버깅해야 하므로, 잡을 수 있는 오류는 PR 단계에서 떨어뜨린다 (PR #35 리뷰 반영).
  # build job과 독립이라 병렬로 돌고, required status check 등록 대상은 여전히 "CI / build" 하나다.
  shell-lint:
    name: shell-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash -n deploy/*.sh
      # 기본 심각도(style까지)로 돈다 — 억제가 필요한 항목은 스크립트 안에 shellcheck 지시어로 사유와 함께 남긴다.
      - run: shellcheck deploy/*.sh
