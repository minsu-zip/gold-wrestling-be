openapi: 3.1.0
info:
  title: 골드레슬링 API
  description: 골드레슬링 체육관 회원 관리·예약 시스템 백엔드 API
  version: v0.0.1
servers:
- url: /
tags:
- name: system
  description: 서버 상태·환경 확인
- name: auth
  description: 인증·토큰
paths:
  /api/auth/refresh:
    post:
      tags:
      - auth
      summary: access 토큰 갱신 (refresh 회전)
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
  /api/auth/logout:
    post:
      tags:
      - auth
      summary: 로그아웃 (refresh 토큰 폐기)
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
        required: true
      responses:
        "204":
          description: No Content
  /api/auth/kakao/login:
    post:
      tags:
      - auth
      summary: 카카오 인가 코드로 로그인 (최초 로그인 시 PENDING 회원 생성)
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KakaoLoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/KakaoLoginResponse"
  /api/system/health:
    get:
      tags:
      - system
      summary: 서버 기동 및 기준 시간대 확인
      operationId: health
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  schemas:
    RefreshTokenRequest:
      type: object
      description: access 토큰 갱신 요청
      properties:
        refreshToken:
          type: string
          description: 발급받은 refresh 토큰 원문
          minLength: 1
      required:
      - refreshToken
    TokenPairResponse:
      type: object
      description: 발급된 access/refresh 토큰 쌍
      properties:
        accessToken:
          type: string
          description: access 토큰(JWT)
        refreshToken:
          type: string
          description: refresh 토큰(다음 회전에 사용)
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: access 토큰 만료 시각
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: refresh 토큰 만료 시각
    LogoutRequest:
      type: object
      description: 로그아웃 요청
      properties:
        refreshToken:
          type: string
          description: 폐기할 refresh 토큰 원문
          minLength: 1
      required:
      - refreshToken
    KakaoLoginRequest:
      type: object
      description: 카카오 인가 코드 로그인 요청
      properties:
        code:
          type: string
          description: 카카오 인가 코드(FE가 카카오 리다이렉트에서 전달받은 값)
          minLength: 1
      required:
      - code
    KakaoLoginResponse:
      type: object
      description: 카카오 로그인 성공 응답 — 토큰과 회원 세션 요약을 함께 담는다
      properties:
        tokens:
          $ref: "#/components/schemas/TokenPairResponse"
          description: 발급된 access/refresh 토큰 쌍
        member:
          $ref: "#/components/schemas/MemberSessionResponse"
          description: "회원 세션 요약 — FE 화면 분기용(AUTH-06, D-034)"
    MemberSessionResponse:
      type: object
      description: 로그인 응답에 포함되는 회원 세션 요약 — FE 화면 분기용
      properties:
        memberId:
          type: integer
          format: int64
          description: 회원 ID
        status:
          type: string
          description: 회원 상태
          enum:
          - PENDING
          - ACTIVE
          - ON_LEAVE
          - INACTIVE
        onboardingCompleted:
          type: boolean
          description: 온보딩(실명·전화번호 입력) 완료 여부 — false면 온보딩 화면
        rejected:
          type: boolean
          description: 가입 거절 여부(D-034) — true면 거절 안내 화면. 사유 원문은 담지 않는다(D-043)
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        serverTime:
          type: string
          format: date-time
        timeZone:
          type: string
