openapi: 3.1.0
info:
  title: 골드레슬링 API
  description: 골드레슬링 체육관 회원 관리·예약 시스템 백엔드 API
  version: v0.0.1
servers:
- url: /
tags:
- name: admin-member
  description: 관리자 회원 관리
- name: system
  description: 서버 상태·환경 확인
- name: auth
  description: 인증·토큰
- name: member
  description: 회원 본인 정보
paths:
  /api/members/me/onboarding:
    post:
      tags:
      - member
      summary: "온보딩 — 실명·전화번호 등록 (최초 1회, 재제출은 409로 거부된다)"
      operationId: submitOnboarding
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MyProfileResponse"
  /api/auth/refresh:
    post:
      tags:
      - auth
      summary: access 토큰 갱신 (refresh 회전)
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
  /api/auth/logout:
    post:
      tags:
      - auth
      summary: 로그아웃 (refresh 토큰 폐기)
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
        required: true
      responses:
        "204":
          description: No Content
  /api/auth/kakao/login:
    post:
      tags:
      - auth
      summary: 카카오 인가 코드로 로그인 (최초 로그인 시 PENDING 회원 생성)
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KakaoLoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/KakaoLoginResponse"
  /api/auth/admin/login:
    post:
      tags:
      - auth
      summary: "관리자 ID/PW 로그인 (카카오 연동 없음, 회원과 동일한 JWT 체계)"
      operationId: login_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
  /api/admin/members/{memberId}/rejection:
    post:
      tags:
      - admin-member
      summary: 가입 거절 (INACTIVE 전환 + 사유 기록)
      operationId: reject
      parameters:
      - name: memberId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectMemberRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MemberDetailResponse"
  /api/admin/members/{memberId}/approval:
    post:
      tags:
      - admin-member
      summary: 가입 승인 (온보딩 완료 PENDING 회원만)
      operationId: approve
      parameters:
      - name: memberId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MemberDetailResponse"
  /api/admin/members/{memberId}/status:
    patch:
      tags:
      - admin-member
      summary: 회원 상태 변경 (ACTIVE가 아니게 되면 해당 회원 강제 로그아웃)
      operationId: changeStatus
      parameters:
      - name: memberId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberStatusRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MemberDetailResponse"
  /api/system/health:
    get:
      tags:
      - system
      summary: 서버 기동 및 기준 시간대 확인
      operationId: health
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/members/me:
    get:
      tags:
      - member
      summary: 본인 프로필 조회 (승인 대기·거절 안내 화면 포함 모든 상태에서 접근 가능)
      operationId: getMyProfile
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MyProfileResponse"
  /api/admin/members:
    get:
      tags:
      - admin-member
      summary: 회원 목록 조회 (검색·상태 필터·페이지네이션. status=PENDING+onboardingCompleted=true
        가 승인 대기 목록)
      operationId: search
      parameters:
      - name: condition
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/MemberSearchCondition"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseMemberSummaryResponse"
  /api/admin/members/{memberId}:
    get:
      tags:
      - admin-member
      summary: 회원 상세 조회 (거절 사유 포함 — 관리자 전용)
      operationId: getDetail
      parameters:
      - name: memberId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MemberDetailResponse"
components:
  schemas:
    OnboardingRequest:
      type: object
      description: "온보딩 제출 요청 — 실명·전화번호(최초 1회만 허용, D-042)"
      properties:
        name:
          type: string
          description: 실명
          example: 홍길동
          maxLength: 50
          minLength: 0
        phoneNumber:
          type: string
          description: 휴대폰 번호(하이픈 포함/미포함 모두 허용)
          example: 010-1234-5678
          minLength: 1
          pattern: "^01[016789]-?\\d{3,4}-?\\d{4}$"
      required:
      - name
      - phoneNumber
    MyProfileResponse:
      type: object
      description: 본인 프로필 — 이름·전화번호·상태와 화면 분기용 플래그를 담는다
      properties:
        memberId:
          type: integer
          format: int64
          description: 회원 ID
        name:
          type:
          - string
          - "null"
          description: 실명 — 온보딩 미완료면 null
        phoneNumber:
          type:
          - string
          - "null"
          description: 전화번호(하이픈 제거된 숫자) — 온보딩 미완료면 null
        status:
          type: string
          description: 회원 상태
          enum:
          - PENDING
          - ACTIVE
          - ON_LEAVE
          - INACTIVE
        onboardingCompleted:
          type: boolean
          description: 온보딩(실명·전화번호 입력) 완료 여부
        rejected:
          type: boolean
          description: 가입 거절 여부(D-034) — true면 거절 안내 화면. 사유 원문은 담지 않는다(D-043)
    RefreshTokenRequest:
      type: object
      description: access 토큰 갱신 요청
      properties:
        refreshToken:
          type: string
          description: 발급받은 refresh 토큰 원문
          minLength: 1
      required:
      - refreshToken
    TokenPairResponse:
      type: object
      description: 발급된 access/refresh 토큰 쌍
      properties:
        accessToken:
          type: string
          description: access 토큰(JWT)
        refreshToken:
          type: string
          description: refresh 토큰(다음 회전에 사용)
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: access 토큰 만료 시각
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: refresh 토큰 만료 시각
    LogoutRequest:
      type: object
      description: 로그아웃 요청
      properties:
        refreshToken:
          type: string
          description: 폐기할 refresh 토큰 원문
          minLength: 1
      required:
      - refreshToken
    KakaoLoginRequest:
      type: object
      description: 카카오 인가 코드 로그인 요청
      properties:
        code:
          type: string
          description: 카카오 인가 코드(FE가 카카오 리다이렉트에서 전달받은 값)
          minLength: 1
      required:
      - code
    KakaoLoginResponse:
      type: object
      description: 카카오 로그인 성공 응답 — 토큰과 회원 세션 요약을 함께 담는다
      properties:
        tokens:
          $ref: "#/components/schemas/TokenPairResponse"
          description: 발급된 access/refresh 토큰 쌍
        member:
          $ref: "#/components/schemas/MemberSessionResponse"
          description: "회원 세션 요약 — FE 화면 분기용(AUTH-06, D-034)"
    MemberSessionResponse:
      type: object
      description: 로그인 응답에 포함되는 회원 세션 요약 — FE 화면 분기용
      properties:
        memberId:
          type: integer
          format: int64
          description: 회원 ID
        status:
          type: string
          description: 회원 상태
          enum:
          - PENDING
          - ACTIVE
          - ON_LEAVE
          - INACTIVE
        onboardingCompleted:
          type: boolean
          description: 온보딩(실명·전화번호 입력) 완료 여부 — false면 온보딩 화면
        rejected:
          type: boolean
          description: 가입 거절 여부(D-034) — true면 거절 안내 화면. 사유 원문은 담지 않는다(D-043)
    AdminLoginRequest:
      type: object
      description: 관리자 ID/PW 로그인 요청
      properties:
        loginId:
          type: string
          description: 관리자 로그인 ID
          example: YOUR_ADMIN_LOGIN_ID
          maxLength: 50
          minLength: 0
        password:
          type: string
          description: 비밀번호
          example: YOUR_ADMIN_PASSWORD
          maxLength: 100
          minLength: 0
      required:
      - loginId
      - password
    AdminLoginResponse:
      type: object
      description: "관리자 로그인 성공 응답 — 토큰과 관리자 요약을 함께 담는다 (D-026, 회원과 동일한 JWT 체계)"
      properties:
        tokens:
          $ref: "#/components/schemas/TokenPairResponse"
          description: 발급된 access/refresh 토큰 쌍
        admin:
          $ref: "#/components/schemas/AdminSummary"
          description: 관리자 요약
    AdminSummary:
      type: object
      description: 관리자 요약 — loginId·passwordHash는 담지 않는다
      properties:
        adminId:
          type: integer
          format: int64
          description: 관리자 ID
        name:
          type: string
          description: 관리자 이름
    RejectMemberRequest:
      type: object
      description: 거절 사유. 관리자 전용 정보이며 회원에게 원문이 노출되지 않는다 (D-043)
      properties:
        reason:
          type: string
          description: "거절 사유(관리자 전용, 500자 이내)"
          example: 제출한 정보와 실제 신원이 일치하지 않습니다.
          maxLength: 500
          minLength: 0
      required:
      - reason
    MemberDetailResponse:
      type: object
      description: 관리자 회원 상세 — 거절 사유 원문 포함
      properties:
        memberId:
          type: integer
          format: int64
          description: 회원 ID
        name:
          type:
          - string
          - "null"
          description: 실명 — 온보딩 미완료면 null
        phoneNumber:
          type:
          - string
          - "null"
          description: 전화번호(하이픈 제거된 숫자) — 온보딩 미완료면 null
        status:
          type: string
          description: 회원 상태
          enum:
          - PENDING
          - ACTIVE
          - ON_LEAVE
          - INACTIVE
        onboardingCompleted:
          type: boolean
          description: 온보딩(실명·전화번호 입력) 완료 여부
        rejected:
          type: boolean
          description: 가입 거절 여부(D-034)
        rejectionReason:
          type:
          - string
          - "null"
          description: "거절 사유 원문 — 관리자 전용, 거절되지 않았으면 null(D-043)"
        branchName:
          type: string
          description: 소속 지점명
        kakaoId:
          type: integer
          format: int64
          description: 카카오 사용자 식별자
        createdAt:
          type: string
          format: date-time
          description: 가입 신청 시각
    UpdateMemberStatusRequest:
      type: object
      description: 변경할 회원 상태. PENDING으로 되돌리면 거절 사유가 초기화되어 재신청 상태가 된다 (D-034)
      properties:
        status:
          type: string
          description: 변경할 상태(PENDING/ACTIVE/ON_LEAVE/INACTIVE)
          enum:
          - PENDING
          - ACTIVE
          - ON_LEAVE
          - INACTIVE
          example: ON_LEAVE
      required:
      - status
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        serverTime:
          type: string
          format: date-time
        timeZone:
          type: string
    MemberSearchCondition:
      type: object
      description: 회원 목록 조회 조건 — 검색어·상태·온보딩완료·페이지네이션
      properties:
        keyword:
          type:
          - string
          - "null"
          description: "이름·전화번호 통합 검색어 (부분 일치, D-035)"
        status:
          type:
          - string
          - "null"
          description: 회원 상태 필터
          enum:
          - PENDING
          - ACTIVE
          - ON_LEAVE
          - INACTIVE
        onboardingCompleted:
          type:
          - boolean
          - "null"
          description: "온보딩(실명·전화번호 입력) 완료 여부 필터. status=PENDING과 함께 true로 주면 관리자\
            \ 승인 대기 목록이 된다(D-035, policies §5.1)"
        page:
          type: integer
          format: int32
          default: 0
          description: 페이지 번호(0부터 시작)
          minimum: 0
        size:
          type: integer
          format: int32
          default: 20
          description: 페이지 크기(1~100)
          maximum: 100
          minimum: 1
    MemberSummaryResponse:
      type: object
      description: 관리자 회원 목록 항목
      properties:
        memberId:
          type: integer
          format: int64
          description: 회원 ID
        name:
          type:
          - string
          - "null"
          description: 실명 — 온보딩 미완료면 null
        phoneNumber:
          type:
          - string
          - "null"
          description: 전화번호(하이픈 제거된 숫자) — 온보딩 미완료면 null
        status:
          type: string
          description: 회원 상태
          enum:
          - PENDING
          - ACTIVE
          - ON_LEAVE
          - INACTIVE
        onboardingCompleted:
          type: boolean
          description: 온보딩(실명·전화번호 입력) 완료 여부
        createdAt:
          type: string
          format: date-time
          description: 가입 신청 시각
    PageResponseMemberSummaryResponse:
      type: object
      description: 페이지네이션 응답
      properties:
        content:
          type: array
          description: 현재 페이지의 항목 목록
          items:
            $ref: "#/components/schemas/MemberSummaryResponse"
        page:
          type: integer
          format: int32
          description: 현재 페이지 번호(0부터 시작)
        size:
          type: integer
          format: int32
          description: 페이지 크기
        totalElements:
          type: integer
          format: int64
          description: 전체 항목 수
        totalPages:
          type: integer
          format: int32
          description: 전체 페이지 수
